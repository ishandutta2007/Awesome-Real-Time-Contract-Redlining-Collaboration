<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="redline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
    .pulse-circle { animation: pulseAnim 4s ease-in-out infinite; }
    .flow-wave { animation: dashWave 12s linear infinite; }
    .badge-float { animation: floatAnim 6s ease-in-out infinite alternate; }
    .cursor-ping { animation: pingAnim 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    
    @keyframes pulseAnim {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes dashWave {
      to { stroke-dashoffset: -120; }
    }
    @keyframes floatAnim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes pingAnim {
      75%, 100% { transform: scale(2); opacity: 0; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Ambient Backdrop Blobs -->
  <g opacity="0.3">
    <circle cx="200" cy="80" r="140" fill="#f43f5e" filter="url(#glow)">
      <animate attributeName="cx" values="200;240;200" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;110;80" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="300" r="160" fill="#3b82f6" filter="url(#glow)">
      <animate attributeName="cx" values="1020;980;1020" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="300;260;300" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="360" r="110" fill="#10b981" filter="url(#glow)">
      <animate attributeName="r" values="110;130;110" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g class="grid-line">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Flowing Dynamic Laser / Stream Lines in Background -->
  <path d="M 0 350 Q 300 280 600 340 T 1200 310" fill="none" stroke="url(#redline-grad)" stroke-width="2.5" stroke-dasharray="10 15" class="flow-wave" opacity="0.6" />
  <path d="M 0 370 Q 300 390 600 360 T 1200 380" fill="none" stroke="url(#teal-grad)" stroke-width="2" stroke-dasharray="8 12" class="flow-wave" opacity="0.4" />

  <!-- Animated Interactive Pills (Floating in lower section) -->
  <g class="badge-float" transform="translate(0, 0)">
    <!-- Pill 1: Real-Time Sync -->
    <g transform="translate(180, 275)">
      <rect width="180" height="38" rx="19" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#38bdf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="38" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Real-Time Sync</text>
    </g>

    <!-- Pill 2: Track Changes & Redlining -->
    <g transform="translate(385, 275)">
      <rect width="215" height="38" rx="19" fill="url(#badge-grad)" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#f43f5e">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite" />
      </circle>
      <text x="38" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">📝 Track Changes &amp; Diff</text>
    </g>

    <!-- Pill 3: AI Playbooks & LegalTech -->
    <g transform="translate(625, 275)">
      <rect width="195" height="38" rx="19" fill="url(#badge-grad)" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#a855f7">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="38" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🤖 AI Playbooks &amp; CLM</text>
    </g>

    <!-- Pill 4: Open Source & Self-Hosted -->
    <g transform="translate(845, 275)">
      <rect width="180" height="38" rx="19" fill="url(#badge-grad)" stroke="#10b981" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#10b981">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite" />
      </circle>
      <text x="38" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🔓 100% Open Source</text>
    </g>
  </g>

  <!-- FOREGROUND: Category Header Tag -->
  <g transform="translate(470, 52)">
    <rect width="260" height="30" rx="15" fill="#1e1e38" stroke="#6366f1" stroke-width="1.2" />
    <text x="130" y="20" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚖️ AWESOME LEGALTECH LIST</text>
  </g>

  <!-- FOREGROUND: Main Title -->
  <text x="600" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Real-Time Contract Redlining
  </text>
  
  <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#redline-grad)" letter-spacing="-0.5">
    &amp; Collaborative Negotiation
  </text>

  <!-- FOREGROUND: Subtitle -->
  <text x="600" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8" font-weight="400">
    Curated SaaS CLM platforms, AI-native negotiation engines &amp; open-source collaborative editors
  </text>

  <!-- Bottom Accent Status Indicator -->
  <g transform="translate(530, 355)">
    <circle cx="8" cy="8" r="5" fill="#22c55e" />
    <circle cx="8" cy="8" r="8" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="5;12" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="13" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Continuously updated • Verified 2026</text>
  </g>
</svg>
